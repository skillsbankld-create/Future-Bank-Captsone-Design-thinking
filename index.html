<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 13 — Future Bank Capstone</title>
<style>
  :root{
    --navy:#080828;
    --blue:#4D88E8;
    --coral:#F26A44;
    --yellow:#FFBC3A;
    --teal:#40BDA9;
    --lightblue:#EBF4FF;
    --white:#FFFFFF;
    --text-muted:#6B7280;
    --danger:#D14343;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Calibri','Segoe UI',Arial,sans-serif;
    background:var(--lightblue);
    color:var(--navy);
    line-height:1.5;
  }
  [dir="rtl"] body, .rtl{ direction:rtl; text-align:right; }

  header.topbar{
    background:var(--navy);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header.topbar img{ height:34px; }
  .lang-toggle{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:4px;
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    color:#fff;
    padding:6px 14px;
    border-radius:16px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .lang-toggle button.active{
    background:var(--coral);
    font-weight:bold;
  }
  .reset-btn{
    background:none;
    border:1px solid rgba(255,255,255,0.25);
    color:rgba(255,255,255,0.65);
    font-size:11px;
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
    font-family:inherit;
  }
  .reset-btn:hover{ color:#fff; border-color:rgba(255,255,255,0.5); }

  .stepper{
    display:flex;
    gap:4px;
    padding:14px 24px;
    background:var(--white);
    border-bottom:1px solid #E2E8F0;
    overflow-x:auto;
  }
  .step-dot{
    flex:1;
    min-width:70px;
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding-bottom:8px;
    border-bottom:3px solid #E2E8F0;
    white-space:nowrap;
  }
  .step-dot.active{
    color:var(--navy);
    font-weight:bold;
    border-bottom-color:var(--coral);
  }
  .step-dot.done{
    border-bottom-color:var(--teal);
    color:var(--navy);
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 120px;
  }

  .card{
    background:var(--white);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:18px;
    border:1px solid #E2E8F0;
  }
  .card.persona{ border-left:5px solid var(--blue); }
  [dir="rtl"] .card.persona{ border-left:none; border-right:5px solid var(--blue); }
  .card.constraints{ border-left:5px solid var(--yellow); }
  [dir="rtl"] .card.constraints{ border-left:none; border-right:5px solid var(--yellow); }
  .card.reveal{ border-left:5px solid var(--coral); }
  [dir="rtl"] .card.reveal{ border-left:none; border-right:5px solid var(--coral); }
  .card.feedback{ border-left:5px solid var(--teal); background:#F0FDFA; }
  [dir="rtl"] .card.feedback{ border-left:none; border-right:5px solid var(--teal); }

  .card h2{ margin:0 0 10px; font-size:19px; color:var(--navy); }
  .card h3{ margin:0 0 8px; font-size:15px; color:var(--navy); }
  .card p{ margin:0 0 8px; font-size:15px; color:#374151; }
  .badge{
    display:inline-block;
    background:var(--coral);
    color:#fff;
    font-size:11px;
    font-weight:bold;
    padding:3px 10px;
    border-radius:12px;
    margin-bottom:10px;
    letter-spacing:0.5px;
  }

  label.field-label{
    display:block;
    font-size:14px;
    font-weight:bold;
    color:var(--navy);
    margin:14px 0 6px;
  }
  label.field-label .hint{
    display:block;
    font-weight:normal;
    color:var(--text-muted);
    font-size:12.5px;
    margin-top:2px;
  }
  input[type=text], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1px solid #CBD5E1;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--navy);
    background:#fff;
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(77,136,232,0.15);
  }
  .error-text{
    color:var(--danger);
    font-size:12.5px;
    margin-top:4px;
    display:none;
  }
  .field.invalid .error-text{ display:block; }
  .field.invalid input, .field.invalid textarea{ border-color:var(--danger); }

  .technique-picker{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:14px 0;
  }
  .technique-btn{
    flex:1;
    min-width:140px;
    padding:14px;
    border:2px solid #E2E8F0;
    border-radius:10px;
    background:#fff;
    cursor:pointer;
    text-align:center;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    color:var(--navy);
  }
  .technique-btn.selected{
    border-color:var(--coral);
    background:#FFF1EB;
  }
  .technique-block{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed #E2E8F0;
  }
  .remove-technique{
    background:none;
    border:none;
    color:var(--danger);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    margin-top:6px;
  }
  .add-second-btn{
    background:none;
    border:1px dashed var(--blue);
    color:var(--blue);
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    width:100%;
    margin-top:8px;
  }

  .dfv-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:8px;
  }
  .yn-toggle{ display:flex; gap:6px; }
  .yn-toggle button{
    border:1px solid #CBD5E1;
    background:#fff;
    padding:7px 16px;
    border-radius:6px;
    font-family:inherit;
    cursor:pointer;
    font-size:13.5px;
  }
  .yn-toggle button.selected.yes{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .yn-toggle button.selected.no{ background:var(--coral); color:#fff; border-color:var(--coral); }

  .nav-bar{
    position:sticky;
    bottom:0;
    background:var(--white);
    border-top:1px solid #E2E8F0;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    max-width:760px;
    margin:0 auto;
  }
  .nav-bar-outer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--white);
    border-top:1px solid #E2E8F0;
    box-shadow:0 -2px 8px rgba(0,0,0,0.04);
  }
  button.nav-btn{
    padding:10px 22px;
    border-radius:8px;
    border:none;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
  }
  button.nav-btn.primary{ background:var(--blue); color:#fff; }
  button.nav-btn.secondary{ background:#fff; color:var(--navy); border:1px solid #CBD5E1; }
  button.nav-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  button.nav-btn.review{ background:var(--teal); color:#fff; }

  .setup-wrap{
    max-width:460px;
    margin:60px auto;
    text-align:center;
  }
  .setup-wrap h1{ font-size:24px; color:var(--navy); margin-bottom:10px; }
  .setup-wrap p{ color:var(--text-muted); margin-bottom:24px; font-size:15px; }
  .setup-wrap input{ margin-bottom:14px; text-align:center; font-size:16px; }
  .setup-wrap button{
    width:100%;
    padding:12px;
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
  }

  .review-section{
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid #E2E8F0;
  }
  .review-section h3{ color:var(--coral); font-size:14px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
  .review-item{ margin-bottom:8px; font-size:14.5px; }
  .review-item .k{ color:var(--text-muted); font-size:12.5px; display:block; }
  .waiting-note{
    background:#FFF9EC;
    border:1px solid var(--yellow);
    border-radius:8px;
    padding:12px 14px;
    font-size:13.5px;
    color:#7A5A00;
  }
  a.proto-link{ color:var(--blue); word-break:break-all; }
</style>
</head>

let lang = 'en';
let groupName = '';
let step = 0; // 0 = setup screen
const STEPS = ['setup','empathize','define','ideate','prototype','test','debrief','review'];

function freshData(){
  return {
    empathize: { insight:'' },
    define: { who:'', what:'', where:'', why:'', pov:'', hmw:'' },
    ideate: {
      techniques: [],
      mindmap: { causes:'', who:'', blocking:'', directions:'' },
      scamper: { substitute:'', combine:'', adapt:'', modify:'', putToUse:'', eliminate:'', reverse:'' },
      worst: { list:'', attribute:'', flip:'' },
      chosenIdea: ''
    },
    prototype: { link:'' },
    test: {
      link:'',
      desirable: { answer:'', reason:'' },
      feasible: { answer:'', reason:'' },
      viable: { answer:'', reason:'' },
      improve: ''
    },
    debrief: { reflection:'', receivedFeedback:'' }
  };
}
let data = freshData();

function T(key){
  return (lang === 'ar' ? AR : EN)[key];
}

/* ============================================================
   LOCAL STORAGE (per device only — no shared backend, no account needed)
   ============================================================ */
const STORAGE_KEY = 'activity13-progress';
function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ groupName, step, data }));
  }catch(e){ console.error('save failed', e); }
}
function resetActivity(){
  if(!confirm(T('resetConfirm'))) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  groupName = '';
  step = 0;
  data = freshData();
  const input = document.getElementById('group-name-input');
  if(input) input.value = '';
  render();
}

/* ============================================================
   SETUP FLOW
   ============================================================ */
function startGroup(){
  const input = document.getElementById('group-name-input');
  const errEl = document.getElementById('setup-error');
  const name = input.value.trim();
  if(!name){
    errEl.textContent = T('setupErrorEmpty');
    errEl.style.display = 'block';
    return;
  }
  groupName = name;
  step = 1;
  saveLocal();
  render();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goNext(){
  if(step === 0){ startGroup(); return; }
  if(!validateStep(step)) return;
  saveLocal();
  if(step < STEPS.length - 1) step++;
  saveLocal();
  render();
}
function goBack(){
  if(step > 1) step--;
  render();
}
function goToReview(){
  step = STEPS.length - 1;
  render();
}

function validateStep(s){
  clearErrors();
  let ok = true;
  if(STEPS[s] === 'empathize'){
    if(!data.empathize.insight || !data.empathize.insight.trim()){
      markInvalid('empathize-insight'); ok = false;
    }
  }
  if(STEPS[s] === 'define'){
    ['who','what','where','why','pov','hmw'].forEach(f=>{
      if(!data.define[f] || !data.define[f].trim()){
        markInvalid('define-'+f); ok = false;
      }
    });
  }
  if(STEPS[s] === 'ideate'){
    if(data.ideate.techniques.length === 0){ ok = false; }
    if(!data.ideate.chosenIdea || !data.ideate.chosenIdea.trim()){
      markInvalid('ideate-chosenIdea'); ok = false;
    }
  }
  if(STEPS[s] === 'prototype'){
    if(!data.prototype.link || !data.prototype.link.trim()){
      markInvalid('prototype-link'); ok = false;
    }
  }
  if(STEPS[s] === 'test'){
    if(!data.test.link || !data.test.link.trim()){
      markInvalid('test-link'); ok = false;
    }
    ['desirable','feasible','viable'].forEach(k=>{
      if(!data.test[k].answer){ ok = false; }
      if(!data.test[k].reason || !data.test[k].reason.trim()){
        markInvalid('test-'+k+'-reason'); ok = false;
      }
    });
  }
  return ok;
}
function markInvalid(id){
  const f = document.getElementById(id);
  if(f) f.classList.add('invalid');
}
function clearErrors(){
  document.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid'));
}

/* ============================================================
   RENDER: TOP CHROME
   ============================================================ */
function setLang(l){
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-ar').classList.toggle('active', l==='ar');
  document.documentElement.setAttribute('dir', l==='ar' ? 'rtl' : 'ltr');
  updateResetLabel();
  render();
}
function updateResetLabel(){
  const btn = document.getElementById('reset-btn');
  if(btn) btn.textContent = T('resetLabel');
}

function renderStepper(){
  const el = document.getElementById('stepper');
  if(step === 0){ el.innerHTML=''; return; }
  const labels = T('stepLabels');
  let html = '';
  for(let i=1;i<STEPS.length;i++){
    let cls = 'step-dot';
    if(i === step) cls += ' active';
    else if(i < step) cls += ' done';
    html += `<div class="${cls}">${labels[i]}</div>`;
  }
  el.innerHTML = html;
}

function renderNav(){
  const back = document.getElementById('back-btn');
  const next = document.getElementById('next-btn');
  const review = document.getElementById('review-btn');
  back.textContent = T('backBtn');
  next.textContent = step === STEPS.length-1 ? '' : T('nextBtn');
  review.textContent = T('reviewBtn');

  back.style.visibility = step <= 1 ? 'hidden' : 'visible';
  next.style.display = step === STEPS.length-1 ? 'none' : 'inline-block';
  review.style.display = (step > 0 && step < STEPS.length-1) ? 'inline-block' : 'none';
}

/* ============================================================
   RENDER: STEPS
   ============================================================ */
function render(){
  document.getElementById('app-main').classList.toggle('rtl', lang==='ar');
  renderStepper();
  renderNav();
  const view = STEPS[step];
  const main = document.getElementById('app-main');
  if(view === 'setup') main.innerHTML = renderSetup();
  else if(view === 'empathize') main.innerHTML = renderEmpathize();
  else if(view === 'define') main.innerHTML = renderDefine();
  else if(view === 'ideate') main.innerHTML = renderIdeate();
  else if(view === 'prototype') main.innerHTML = renderPrototype();
  else if(view === 'test') main.innerHTML = renderTest();
  else if(view === 'debrief') main.innerHTML = renderDebrief();
  else if(view === 'review') main.innerHTML = renderReview();

  if(view !== 'test' && view !== 'debrief' && view !== 'review'){
    attachStandardListeners();
  }
}

  <div class="technique-block">
    <h3>${T('techMindmap')}</h3>
    <label class="field-label">${T('mindmapCauses')}</label>
    <textarea data-model="ideate.mindmap.causes" oninput="onInput(event)">${m.causes}</textarea>
    <label class="field-label">${T('mindmapWho')}</label>
    <textarea data-model="ideate.mindmap.who" oninput="onInput(event)">${m.who}</textarea>
    <label class="field-label">${T('mindmapBlocking')}</label>
    <textarea data-model="ideate.mindmap.blocking" oninput="onInput(event)">${m.blocking}</textarea>
    <label class="field-label">${T('mindmapDirections')}</label>
    <textarea data-model="ideate.mindmap.directions" oninput="onInput(event)">${m.directions}</textarea>
    <button type="button" class="remove-technique" onclick="toggleTechnique('mindmap')">${T('removeTechnique')}</button>
  </div>`;
}
function renderScamperBlock(){
  const s = data.ideate.scamper;
  const fields = [
    ['substitute','scamperSubstitute'],['combine','scamperCombine'],['adapt','scamperAdapt'],
    ['modify','scamperModify'],['putToUse','scamperPutToUse'],['eliminate','scamperEliminate'],['reverse','scamperReverse']
  ];
  let html = `<div class="technique-block"><h3>${T('techScamper')}</h3>`;
  fields.forEach(([key,labelKey])=>{
    html += `<label class="field-label">${T(labelKey)}</label>
    <textarea data-model="ideate.scamper.${key}" oninput="onInput(event)">${s[key]}</textarea>`;
  });
  html += `<button type="button" class="remove-technique" onclick="toggleTechnique('scamper')">${T('removeTechnique')}</button></div>`;
  return html;
}
function renderWorstBlock(){
  const w = data.ideate.worst;
  return `
  <div class="technique-block">
    <h3>${T('techWorst')}</h3>
    <label class="field-label">${T('worstListLabel')}<span class="hint">${T('worstListHint')}</span></label>
    <textarea data-model="ideate.worst.list" oninput="onInput(event)">${w.list}</textarea>
    <label class="field-label">${T('worstAttributeLabel')}<span class="hint">${T('worstAttributeHint')}</span></label>
    <textarea data-model="ideate.worst.attribute" oninput="onInput(event)">${w.attribute}</textarea>
    <label class="field-label">${T('worstFlipLabel')}<span class="hint">${T('worstFlipHint')}</span></label>
    <textarea data-model="ideate.worst.flip" oninput="onInput(event)">${w.flip}</textarea>
    <button type="button" class="remove-technique" onclick="toggleTechnique('worst')">${T('removeTechnique')}</button>
  </div>`;
}
function toggleTechnique(tech){
  const idx = data.ideate.techniques.indexOf(tech);
  if(idx === -1){
    if(data.ideate.techniques.length >= 2) return;
    data.ideate.techniques.push(tech);
  }else{
    data.ideate.techniques.splice(idx,1);
  }
  saveLocal();
  render();
}

function renderPrototype(){
  const p = data.prototype;
  return `
  <div class="card">
    <h2>${T('prototypeTitle')}</h2>
    <p>${T('prototypeInstructions')}</p>
    <div class="field" id="prototype-link">
      <label class="field-label">${T('prototypeLinkLabel')}<span class="hint">${T('prototypeLinkHint')}</span></label>
      <input type="text" data-model="prototype.link" oninput="onInput(event)" value="${p.link}" placeholder="${T('prototypeLinkPlaceholder')}">
      <div class="error-text">${T('errorRequired')}</div>
    </div>
  </div>`;
}

/* ---------- TEST (async, needs to look up target group) ---------- */
function renderTest(){
  const t = data.test;
  return `
  <div class="card">
    <h2>${T('testTitle')}</h2>
    <p>${T('testInstructions')}</p>
    <div class="field" id="test-link">
      <label class="field-label">${T('testLinkLabel')}</label>
      <input type="text" data-model="test.link" oninput="onInput(event)" value="${t.link}" placeholder="${T('testLinkPlaceholder')}">
      <div class="error-text">${T('errorRequired')}</div>
    </div>
  </div>
  <div class="card persona">
    <h3>${T('personaCardTitle')}</h3>
    <p>${T('revealBody')}</p>
  </div>
  <div class="card constraints">
    <h3>${T('constraintsCardTitle')}</h3>
    <ul style="margin:0; padding-inline-start:20px; font-size:14.5px; color:#374151;">
      <li>${T('constraintsBody1')}</li>
      <li>${T('constraintsBody2')}</li>
      <li>${T('constraintsBody3')}</li>
      <li>${T('constraintsBody4')}</li>
    </ul>
  </div>
  <div class="card">
    ${renderDfvRow('desirable', T('desirableLabel'))}
    ${renderDfvRow('feasible', T('feasibleLabel'))}
    ${renderDfvRow('viable', T('viableLabel'))}
    <div class="field" style="margin-top:16px;">
      <label class="field-label">${T('improveLabel')}</label>
      <textarea data-model="test.improve" oninput="onInput(event)">${t.improve}</textarea>
    </div>
  </div>`;
}
function renderDfvRow(key, label){
  const t = data.test[key];
  return `
  <div class="field" id="test-${key}-reason" style="margin-bottom:16px;">
    <label class="field-label">${label}</label>
    <div class="dfv-row">
      <div class="yn-toggle">
        <button type="button" class="${t.answer==='yes'?'selected yes':''}" onclick="setDfvAnswer('${key}','yes')">${T('yesLabel')}</button>
        <button type="button" class="${t.answer==='no'?'selected no':''}" onclick="setDfvAnswer('${key}','no')">${T('noLabel')}</button>
      </div>
    </div>
    <input type="text" data-model="test.${key}.reason" oninput="onInput(event)" value="${t.reason}" placeholder="${T('reasonPlaceholder')}" style="margin-top:8px;">
    <div class="error-text">${T('errorRequired')}</div>
  </div>`;
}
function setDfvAnswer(key, val){
  data.test[key].answer = val;
  saveLocal();
  render();
}

/* ---------- DEBRIEF (async, needs feedback the group received) ---------- */
function renderDebrief(){
  const d = data.debrief;
  return `
  <div class="card feedback">
    <h3>${T('debriefFeedbackTitle')}</h3>
    <p style="color:var(--text-muted); font-size:13.5px;">${T('debriefFeedbackHint')}</p>
    <div class="field">
      <textarea data-model="debrief.receivedFeedback" oninput="onInput(event)" placeholder="${T('debriefReceivedPlaceholder')}">${d.receivedFeedback}</textarea>
    </div>
  </div>
  <div class="card">
    <h2>${T('debriefTitle')}</h2>
    <div class="field">
      <label class="field-label">${T('debriefQuestionLabel')}</label>
      <textarea data-model="debrief.reflection" oninput="onInput(event)">${d.reflection}</textarea>
    </div>
  </div>`;
}

/* ---------- REVIEW ---------- */
function renderReview(){
  const d = data;

  function item(label, val){
    return `<div class="review-item"><span class="k">${label}</span>${val && val.trim() ? escapeHtml(val) : T('reviewEmpty')}</div>`;
  }

  let ideateHtml = '';
  d.ideate.techniques.forEach(t=>{
    if(t==='mindmap'){
      ideateHtml += item(T('mindmapCauses'), d.ideate.mindmap.causes);
      ideateHtml += item(T('mindmapDirections'), d.ideate.mindmap.directions);
    }
    if(t==='scamper'){
      ideateHtml += item(T('scamperCombine'), d.ideate.scamper.combine);
      ideateHtml += item(T('scamperEliminate'), d.ideate.scamper.eliminate);
    }
    if(t==='worst'){
      ideateHtml += item(T('worstFlipLabel'), d.ideate.worst.flip);
    }
  });
  ideateHtml += item(T('chosenIdeaLabel'), d.ideate.chosenIdea);

  return `
  <div class="card">
    <h2>${T('reviewTitle')}</h2>
    <p style="color:var(--text-muted); font-size:14px;">${T('reviewSubtitle')}</p>
  </div>
  <div class="card">
    <div class="review-section">
      <h3>${T('reviewEmpathize')}</h3>
      ${item(T('empathizePromptLabel'), d.empathize.insight)}
    </div>
    <div class="review-section">
      <h3>${T('reviewDefine')}</h3>
      ${item(T('povLabel'), d.define.pov)}
      ${item(T('hmwLabel'), d.define.hmw)}
    </div>
    <div class="review-section">
      <h3>${T('reviewIdeate')}</h3>
      ${ideateHtml}
    </div>
    <div class="review-section">
      <h3>${T('reviewPrototype')}</h3>
      ${item(T('prototypeLinkLabel'), d.prototype.link)}
    </div>
    <div class="review-section">
      <h3>${T('reviewTest')}</h3>
      ${item(T('testLinkLabel'), d.test.link)}
      ${item(T('desirableLabel'), d.test.desirable.answer ? d.test.desirable.answer + ' — ' + d.test.desirable.reason : '')}
      ${item(T('feasibleLabel'), d.test.feasible.answer ? d.test.feasible.answer + ' — ' + d.test.feasible.reason : '')}
      ${item(T('viableLabel'), d.test.viable.answer ? d.test.viable.answer + ' — ' + d.test.viable.reason : '')}
    </div>
    <div class="review-section" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
      <h3>${T('reviewDebrief')}</h3>
      ${item(T('debriefFeedbackTitle'), d.debrief.receivedFeedback)}
      ${item(T('debriefQuestionLabel'), d.debrief.reflection)}
    </div>
  </div>`;
}

/* ============================================================
   INPUT BINDING
   ============================================================ */
function onInput(e){
  const path = e.target.getAttribute('data-model').split('.');
  let obj = data;
  for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
  obj[path[path.length-1]] = e.target.value;
  const fieldWrap = e.target.closest('.field');
  if(fieldWrap) fieldWrap.classList.remove('invalid');
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(saveLocal, 500);
}
function attachStandardListeners(){ /* inputs use inline oninput, nothing extra needed */ }
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   INIT — resume from this device's saved progress, if any
   ============================================================ */
(function init(){
  const saved = loadLocal();
  if(saved && saved.data){
    groupName = saved.groupName || '';
    step = saved.step || 0;
    data = Object.assign(freshData(), saved.data);
  }
  updateResetLabel();
  render();
})();
</script>
</body>
</html>
